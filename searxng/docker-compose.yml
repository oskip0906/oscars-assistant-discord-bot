services:
  searxng:
    image: searxng/searxng:latest
    container_name: panda-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"     # loopback only — private to this machine
    volumes:
      - ./config:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARXNG_HOSTNAME=localhost
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
