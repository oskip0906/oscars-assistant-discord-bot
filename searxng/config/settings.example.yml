# Panda's private SearXNG metasearch instance — local, no external rate limits.
use_default_settings: true

server:
  secret_key: "REPLACE_ME_run_openssl_rand_hex_32"
  limiter: false          # no bot-limiter: it's a private loopback instance
  image_proxy: true
  bind_address: "0.0.0.0"

search:
  safe_search: 1
  formats:
    - html
    - json                # <-- enables the JSON API the bot uses

# PMS's sandboxed network is slower than a laptop's: at the 3s default even
# Wikipedia timed out there, and at 8s a cold start (Google CSE fetches a token
# first) running 4 parallel searches timed out every engine at once.
outgoing:
  request_timeout: 12.0
  max_request_timeout: 15.0

engines:
  - name: wikipedia
    disabled: false
  # Brave rate-limits this instance and DuckDuckGo answers it with a CAPTCHA, so
  # these add general web engines that do answer. Bing stays off: it answers
  # for one word of the query ("who won ..." -> South Korean won), all junk.
  - name: yahoo
    disabled: false
  - name: mojeek
    inactive: false
  - name: google images
    disabled: false
  - name: youtube
    disabled: false
  - name: bing news
    disabled: false
  # Search by image (Panda's reverse_image_search): not upstream, it is
  # searxng/engines/yandex_reverse.py, copied in by the Dockerfile and
  # scripts/ensure-searxng.sh. It only runs on a query that is an image URL.
  - name: yandex reverse
    engine: yandex_reverse
    shortcut: yrev
    timeout: 15.0       # Yandex takes a few seconds to match an image
    disabled: false

ui:
  static_use_hash: true
