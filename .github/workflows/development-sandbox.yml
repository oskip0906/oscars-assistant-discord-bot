name: Development sandbox
run-name: Development sandbox ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: Repository to change (owner/name)
        required: true
        type: string
      base:
        description: Base branch
        required: true
        type: string
      instruction:
        description: Approved development task
        required: true
        type: string
      model:
        description: OpenRouter development model
        required: true
        type: string
      request_id:
        required: true
        type: string
      branch:
        required: true
        type: string
      commit_title:
        required: true
        type: string
      auto_merge:
        required: true
        type: boolean
      self_fix:
        required: true
        type: boolean

# Development happens in a separate checkout of the target repository, never in
# this one. GH_PAT is the same GitHub token the bot runs on (GITHUB_PAT; Actions
# secret names can't start with GITHUB_). It is never exposed to the OpenRouter
# request or to the checked out target files. When that secret is missing the job falls back to the
# built-in GITHUB_TOKEN, which can only reach this repository — hence the write
# permissions below.
permissions:
  contents: write
  pull-requests: write

jobs:
  develop:
    name: ${{ inputs.request_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      # Empty secrets are falsy in expressions, so this resolves to the built-in
      # token whenever the PAT has not been configured.
      SANDBOX_TOKEN: ${{ secrets.GH_PAT || github.token }}
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
      HAS_SANDBOX_PAT: ${{ secrets.GH_PAT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Fail here, before the model call, when the job could never open a pull
      # request. A late failure wastes an OpenRouter request and leaves Panda
      # waiting for a PR that is never coming.
      - name: Check sandbox credentials
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ "$HAS_SANDBOX_PAT" != "true" ]; then
            if [ "$TARGET_REPO" != "$GITHUB_REPOSITORY" ]; then
              echo "::error::GH_PAT is not set in $GITHUB_REPOSITORY. Add it as a repository Actions secret (fine-grained PAT with Contents and Pull requests read/write on $TARGET_REPO) to develop repositories other than this one."
              exit 1
            fi
            echo "::warning::GH_PAT is not set; using the built-in GITHUB_TOKEN. Pull requests it opens or merges do not trigger other workflows."
          fi
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "::error::OPENROUTER_API_KEY is not set as a repository Actions secret in $GITHUB_REPOSITORY."
            exit 1
          fi
          # A deleted key only surfaces later as OpenRouter's cryptic "User not found".
          if ! curl -sf -o /dev/null -H "Authorization: Bearer $OPENROUTER_API_KEY" https://openrouter.ai/api/v1/key; then
            echo "::error::OpenRouter rejected OPENROUTER_API_KEY in $GITHUB_REPOSITORY (deleted, revoked, or mistyped key). Replace the secret with a live key."
            exit 1
          fi
          if ! gh api "repos/$TARGET_REPO" --jq .full_name > /dev/null; then
            echo "::error::The sandbox token cannot read $TARGET_REPO. Check that the repository exists and that the token grants it Contents and Pull requests access."
            exit 1
          fi
          if [ "$(gh api "repos/$TARGET_REPO" --jq '.permissions.push // "unknown"')" = "false" ]; then
            echo "::error::The sandbox token has read-only access to $TARGET_REPO and cannot push the development branch."
            exit 1
          fi
      - name: Create isolated target checkout
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          BASE: ${{ inputs.base }}
        run: |
          # The helper reads the token from the environment at push time, so it
          # is never written into .git/config or into a command line.
          git config --global credential.helper '!f() { echo username=x-access-token; echo "password=$SANDBOX_TOKEN"; }; f'
          git clone --single-branch --branch "$BASE" "https://github.com/$TARGET_REPO.git" target
      - name: Develop, verify, and open pull request
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TARGET_REPO: ${{ inputs.target_repo }}
          BASE: ${{ inputs.base }}
          INSTRUCTION: ${{ inputs.instruction }}
          MODEL: ${{ inputs.model }}
          BRANCH: ${{ inputs.branch }}
          COMMIT_TITLE: ${{ inputs.commit_title }}
          AUTO_MERGE: ${{ inputs.auto_merge }}
          SELF_FIX: ${{ inputs.self_fix }}
          # GitHub's hosted MCP server needs a user PAT; the Actions GITHUB_TOKEN
          # is not accepted there. Absent, the sandbox runs with file tools only.
          GH_PAT: ${{ secrets.GH_PAT }}
          # Remote writes bypass node --check, npm test, and the FORBIDDEN path
          # guard, so they stay off unless the repository variable says otherwise.
          SANDBOX_MCP_WRITE: ${{ vars.SANDBOX_MCP_WRITE }}
        run: node .github/scripts/development-sandbox.mjs target
