name: Development sandbox
run-name: Development sandbox ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base branch
        required: true
        type: string
      instruction:
        description: Approved development task
        required: true
        type: string
      request_id:
        required: true
        type: string
      branch:
        required: true
        type: string
      commit_title:
        required: true
        type: string
      auto_merge:
        required: true
        type: boolean

# The job token can only read, so Claude can never push. GH_PAT appears only in
# the last step, after Claude has exited; a PR it opens also triggers CI, which
# a GITHUB_TOKEN-opened PR would not.
permissions:
  contents: read

jobs:
  develop:
    name: ${{ inputs.request_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: Create branch
        env:
          BRANCH: ${{ inputs.branch }}
        run: git switch -c "$BRANCH"

      # Nobody can answer mid-run: --dangerously-skip-permissions never asks for
      # permission, --permission-prompts none removes AskUserQuestion. Claude can
      # run anything, but its token is read-only and GH_PAT isn't in this step.
      - name: Claude Code
        id: claude
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ inputs.instruction }}
          claude_args: |
            --max-turns 60
            --dangerously-skip-permissions
            --permission-prompts none
            --append-system-prompt "You are running unattended in CI and nobody can reply. Never ask questions or wait for confirmation: choose the most reasonable reading of the task, finish it, and end with a short summary of what you changed and any assumptions you made. Run npm test before you stop. Do not commit, push, or open a pull request; the workflow does that. Do not edit .github/, .env files, data/, or node_modules/."

      # The action hides Claude's output; its last message says why a run failed
      # or changed nothing (a bad token, a task it could not act on).
      - name: Claude's final message
        if: always() && steps.claude.outcome != 'skipped'
        run: jq -r 'last(.[] | select(.type == "result")) | .result // empty' "$RUNNER_TEMP/claude-execution-output.json" || true

      # Same paths as FORBIDDEN in src/agent/tools/repoAgent.js.
      - name: Check changes
        run: |
          git add -A
          if git diff --cached --quiet; then echo "::error::Claude made no changes"; exit 1; fi
          if git diff --cached --name-only | grep -Ei '(^|/)(\.git|node_modules|data)/|(^|/)\.env(\.|$)|^\.github/'; then
            echo "::error::The change touches a protected path"; exit 1
          fi
      - name: Run checks
        run: npm test
      - name: Push and open pull request
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BRANCH: ${{ inputs.branch }}
          BASE: ${{ inputs.base }}
          TITLE: ${{ inputs.commit_title }}
          REQUEST_ID: ${{ inputs.request_id }}
          AUTO_MERGE: ${{ inputs.auto_merge }}
        run: |
          summary=$(jq -r 'last(.[] | select(.type == "result")) | .result // empty' "$RUNNER_TEMP/claude-execution-output.json" 2>/dev/null || true)
          body="${summary:-Claude Code change.}"$'\n\n'"Self-fix $REQUEST_ID, approved by Oscar in Discord."
          git commit -q -m "$TITLE" -m "$body"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$BRANCH" --title "$TITLE" --body "$body"
          if [ "$AUTO_MERGE" = "true" ]; then
            gh pr merge "$BRANCH" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --auto \
              || echo "::warning::Could not enable auto-merge; the pull request stays open for a manual merge."
          fi
