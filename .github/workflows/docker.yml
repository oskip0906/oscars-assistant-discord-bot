name: Build and push Docker image

# Builds the bot image and publishes it to Docker Hub on every push to main.
# Requires two repo secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/oscars-assistant-discord-bot:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/oscars-assistant-discord-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Panda's SearXNG with its settings baked in, for hosts with no file mounts.
      - name: Build and push SearXNG
        uses: docker/build-push-action@v6
        with:
          context: searxng
          file: searxng/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/panda-searxng:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/panda-searxng:${{ github.sha }}

      # Swap the PMS containers onto the images just pushed, which redeploys them.
      # PMS has no API tokens yet, so this signs in with the account's email and
      # password, the same Supabase sign-in `pms login --email` does. The key is
      # the CLI's public publishable key, not a secret.
      - name: Deploy to PMS
        env:
          PMS_EMAIL: ${{ secrets.PMS_EMAIL }}
          PMS_PASSWORD: ${{ secrets.PMS_PASSWORD }}
          PMS_AUTH: https://wwickoajouezsoodlllo.supabase.co/auth/v1/token?grant_type=password
          PMS_AUTH_KEY: sb_publishable_RzVjSg1pNdV_cBQvowjAuw_7OY467iw
          PMS_PROJECT: https://api.pmservers.org/v1/projects/prj_d6zd0y6e3t41
          # Cloudflare in front of api.pmservers.org challenges plain curl from
          # GitHub's runners; identify as the official CLI does.
          PMS_UA: pms/0.5.0
          HUB: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$PMS_EMAIL" ] || [ -z "$PMS_PASSWORD" ]; then
            echo "::warning::PMS_EMAIL / PMS_PASSWORD are not set, so nothing was deployed to PMS."
            exit 0
          fi
          token=$(jq -n --arg email "$PMS_EMAIL" --arg password "$PMS_PASSWORD" '{$email, $password}' |
            curl -sS -X POST "$PMS_AUTH" -H "apikey: $PMS_AUTH_KEY" -H 'Content-Type: application/json' -d @- |
            jq -r '.access_token // empty')
          if [ -z "$token" ]; then echo "::error::PMS sign-in failed: check PMS_EMAIL and PMS_PASSWORD."; exit 1; fi
          echo "::add-mask::$token"
          auth="Authorization: Bearer $token"
          # The account that owns the project is the one that can deploy to it.
          echo "Signed in as auth user $(python3 -c 'import sys, json, base64; p = sys.stdin.read().split(".")[1]; print(json.loads(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4)))["sub"])' <<<"$token")"
          echo "PMS /me: $(curl -sS -w ' (HTTP %{http_code})' https://api.pmservers.org/v1/me -H "$auth" -A "$PMS_UA")"
          if ! curl -fsS "$PMS_PROJECT" -H "$auth" -A "$PMS_UA" >/dev/null; then
            echo "::error::This PMS account cannot see the project. PMS_EMAIL / PMS_PASSWORD must belong to the account that owns it."
            exit 1
          fi

          # deploy <container name> <container id> <image>: point it at the image,
          # then wait until that image is running (or show why it failed).
          deploy() {
            url="$PMS_PROJECT/containers/$2"
            res=$(jq -n --arg image "$3" '{$image}' | curl -sS -w '\n%{http_code}' -X PATCH "$url" -H "$auth" -A "$PMS_UA" -H 'Content-Type: application/json' -d @-)
            code=$(tail -n1 <<<"$res")
            if [ "${code:0:1}" != 2 ]; then echo "::error::PMS refused to update $1 (HTTP $code): $(sed '$d' <<<"$res")"; return 1; fi
            sleep 15 # let the old container's "running" give way to the redeploy
            for _ in $(seq 60); do
              sleep 5
              status=$(curl -fsS "$url" -H "$auth" -A "$PMS_UA" | jq -r --arg image "$3" 'if .image == $image then .status else "updating" end' || echo unreachable)
              echo "$1: $status"
              case "$status" in
                running) return 0 ;;
                failed) curl -fsS "$url/logs?tail=40" -H "$auth" -A "$PMS_UA" | jq -r '.lines[].message'; return 1 ;;
              esac
            done
            echo "::error::$1 was not running after 5 minutes."; return 1
          }
          deploy panda-searxng ctr_30a2nhctz7kh "$HUB/panda-searxng:$GITHUB_SHA"
          deploy panda-bot ctr_b01e7aw6var8 "$HUB/oscars-assistant-discord-bot:$GITHUB_SHA"
